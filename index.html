<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Community</title>
<style>
body {
  background: #313338;
  color: white;
  font-family: Arial;
  display: grid;
  place-items: center;
  min-height: 90vh;
}
.card {
  background: #2b2d31;
  padding: 30px;
  border-radius: 18px;
  text-align: center;
  width: 80%;
  max-width: 350px;
}
.logo {
  background: #5865f2;
  padding: 25px;
  border-radius: 25px;
  font-size: 40px;
  font-weight: bold;
  display: inline-block;
}
button {
  background: #5865f2;
  color: white;
  border: 0;
  padding: 14px 25px;
  border-radius: 8px;
  font-weight: bold;
}
.note { color: #b5bac1; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h2>Discord Community</h2>
  <p>You're invited to our community!</p>
  <button onclick="alert('Demo page only!')">
    VIEW INVITATION
  </button>
  <p class="note">Unofficial demo page — not a real Discord invite.</p>
</div>
</body>
</html>
